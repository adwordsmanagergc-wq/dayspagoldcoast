<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Gold Coast skyline silhouette at golden hour over the Pacific — Day Spa Gold Coast 2026">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F3A5F"/>
      <stop offset="18%" stop-color="#3D5A7C"/>
      <stop offset="38%" stop-color="#9C6E78"/>
      <stop offset="58%" stop-color="#E8A076"/>
      <stop offset="78%" stop-color="#F8C98E"/>
      <stop offset="100%" stop-color="#FFE2B0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.62" cy="0.78" r="0.13">
      <stop offset="0%" stop-color="#FFF6DC" stop-opacity="1"/>
      <stop offset="40%" stop-color="#FFD89A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFD89A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="0.62" cy="0.78" r="0.36">
      <stop offset="0%" stop-color="#FFD49C" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFD49C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7FA9B4"/>
      <stop offset="35%" stop-color="#3F6F7E"/>
      <stop offset="100%" stop-color="#1B3A47"/>
    </linearGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E2632" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0E2632" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0BC8B"/>
      <stop offset="100%" stop-color="#A87E51"/>
    </linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2A3A"/>
      <stop offset="100%" stop-color="#0A1620"/>
    </linearGradient>
    <linearGradient id="cityFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3F4E60" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1B2733" stop-opacity="0.85"/>
    </linearGradient>

    <symbol id="palm-frond" viewBox="-100 -200 200 220">
      <g fill="#0A141A">
        <path d="M0 0 C -10 -60 -50 -120 -95 -160 C -55 -130 -25 -90 -8 -55 Z"/>
        <path d="M0 0 C 10 -60 50 -120 95 -160 C 55 -130 25 -90 8 -55 Z"/>
        <path d="M0 0 C -30 -50 -90 -90 -140 -100 C -90 -75 -55 -55 -22 -30 Z"/>
        <path d="M0 0 C 30 -50 90 -90 140 -100 C 90 -75 55 -55 22 -30 Z"/>
        <path d="M0 0 C -8 -80 -22 -160 -36 -200 C -22 -150 -10 -90 -3 -50 Z"/>
        <path d="M0 0 C 8 -80 22 -160 36 -200 C 22 -150 10 -90 3 -50 Z"/>
      </g>
    </symbol>
  </defs>

  <!-- sky -->
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#sunGlow)"/>
  <circle cx="1190" cy="842" r="74" fill="url(#sun)"/>

  <!-- distant haze city to the south, lighter -->
  <g fill="url(#cityFar)">
    <rect x="40"   y="700" width="46" height="120"/>
    <rect x="100"  y="680" width="38" height="140"/>
    <rect x="148"  y="660" width="60" height="160"/>
    <rect x="220"  y="700" width="42" height="120"/>
    <rect x="270"  y="690" width="36" height="130"/>
    <rect x="316"  y="640" width="56" height="180"/>
    <rect x="382"  y="700" width="40" height="120"/>
    <rect x="432"  y="680" width="46" height="140"/>
  </g>

  <!-- main Surfers Paradise skyline silhouette -->
  <g fill="url(#city)">
    <!-- left cluster: hotel/resort towers -->
    <rect x="500" y="640" width="64"  height="180"/>
    <rect x="572" y="600" width="78"  height="220"/>
    <rect x="660" y="560" width="96"  height="260" rx="3"/>
    <polygon points="660,560 708,520 756,560"/>
    <rect x="766" y="600" width="58"  height="220"/>
    <rect x="832" y="640" width="46"  height="180"/>

    <!-- mid cluster: dense central -->
    <rect x="900"  y="540" width="74"  height="280" rx="3"/>
    <rect x="982"  y="500" width="62"  height="320"/>
    <rect x="1052" y="560" width="50"  height="260"/>
    <rect x="1110" y="520" width="68"  height="300" rx="3"/>

    <!-- Q1-style spire tower (focal point) -->
    <rect x="1196" y="360" width="80"  height="460" rx="4"/>
    <rect x="1208" y="335" width="56"  height="30"/>
    <rect x="1220" y="305" width="32"  height="32"/>
    <rect x="1232" y="225" width="8"   height="80"/>
    <rect x="1234" y="170" width="4"   height="60"/>

    <!-- right cluster: more residential towers -->
    <rect x="1290" y="500" width="58"  height="320"/>
    <rect x="1356" y="540" width="78"  height="280" rx="3"/>
    <polygon points="1356,540 1395,495 1434,540"/>
    <rect x="1442" y="580" width="52"  height="240"/>
    <rect x="1502" y="540" width="68"  height="280"/>
    <rect x="1578" y="600" width="44"  height="220"/>
    <rect x="1630" y="640" width="56"  height="180"/>
    <rect x="1694" y="660" width="46"  height="160"/>
    <rect x="1748" y="690" width="40"  height="130"/>
    <rect x="1796" y="700" width="36"  height="120"/>
    <rect x="1840" y="680" width="44"  height="140"/>
  </g>

  <!-- subtle window glints (warm, evening lights) -->
  <g fill="#FFD79A" opacity="0.85">
    <rect x="918"  y="572" width="3" height="3"/>
    <rect x="932"  y="610" width="3" height="3"/>
    <rect x="998"  y="538" width="3" height="3"/>
    <rect x="1018" y="588" width="3" height="3"/>
    <rect x="1064" y="606" width="3" height="3"/>
    <rect x="1130" y="556" width="3" height="3"/>
    <rect x="1148" y="614" width="3" height="3"/>
    <rect x="1216" y="424" width="3" height="3"/>
    <rect x="1242" y="488" width="3" height="3"/>
    <rect x="1228" y="570" width="3" height="3"/>
    <rect x="1252" y="660" width="3" height="3"/>
    <rect x="1300" y="540" width="3" height="3"/>
    <rect x="1372" y="600" width="3" height="3"/>
    <rect x="1404" y="640" width="3" height="3"/>
    <rect x="1518" y="582" width="3" height="3"/>
    <rect x="1546" y="660" width="3" height="3"/>
  </g>

  <!-- water line -->
  <rect x="0" y="820" width="1920" height="200" fill="url(#ocean)"/>

  <!-- city reflection in water (squashed, faded) -->
  <g transform="translate(0 1641) scale(1 -0.45)" opacity="0.55">
    <g fill="url(#reflect)">
      <rect x="500" y="640" width="64"  height="180"/>
      <rect x="572" y="600" width="78"  height="220"/>
      <rect x="660" y="560" width="96"  height="260"/>
      <rect x="766" y="600" width="58"  height="220"/>
      <rect x="832" y="640" width="46"  height="180"/>
      <rect x="900" y="540" width="74"  height="280"/>
      <rect x="982" y="500" width="62"  height="320"/>
      <rect x="1052" y="560" width="50" height="260"/>
      <rect x="1110" y="520" width="68" height="300"/>
      <rect x="1196" y="360" width="80" height="460"/>
      <rect x="1232" y="225" width="8"  height="135"/>
      <rect x="1290" y="500" width="58" height="320"/>
      <rect x="1356" y="540" width="78" height="280"/>
      <rect x="1442" y="580" width="52" height="240"/>
      <rect x="1502" y="540" width="68" height="280"/>
      <rect x="1578" y="600" width="44" height="220"/>
      <rect x="1630" y="640" width="56" height="180"/>
      <rect x="1694" y="660" width="46" height="160"/>
    </g>
  </g>

  <!-- shimmer streaks on water under sun -->
  <g fill="#FFE3B5" opacity="0.55">
    <rect x="1170" y="858" width="40" height="2" rx="1"/>
    <rect x="1150" y="876" width="80" height="2" rx="1"/>
    <rect x="1130" y="896" width="120" height="2" rx="1"/>
    <rect x="1140" y="916" width="100" height="2" rx="1"/>
    <rect x="1160" y="940" width="60" height="2" rx="1"/>
  </g>

  <!-- gentle wave lines -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.2">
    <path d="M0 880 Q 240 870 480 880 T 960 880 T 1440 880 T 1920 880"/>
    <path d="M0 922 Q 240 910 480 922 T 960 922 T 1440 922 T 1920 922" stroke-opacity="0.28"/>
    <path d="M0 970 Q 240 958 480 970 T 960 970 T 1440 970 T 1920 970" stroke-opacity="0.22"/>
  </g>

  <!-- beach foreshore -->
  <path d="M0 1010 Q 480 980 960 1000 T 1920 1000 V1080 H0 Z" fill="url(#sand)"/>
  <ellipse cx="280" cy="1042" rx="200" ry="6" fill="#000000" opacity="0.18"/>
  <ellipse cx="1640" cy="1042" rx="220" ry="6" fill="#000000" opacity="0.18"/>

  <!-- foreground palm silhouettes for depth -->
  <g transform="translate(180 1020)">
    <rect x="-7" y="-360" width="14" height="360" fill="#080F14" rx="3"/>
    <use href="#palm-frond" width="320" height="320" transform="translate(-160 -520)"/>
    <use href="#palm-frond" width="280" height="280" transform="translate(-140 -500) rotate(35 140 140)"/>
    <use href="#palm-frond" width="280" height="280" transform="translate(-140 -500) rotate(-30 140 140)"/>
  </g>
  <g transform="translate(1740 1020)">
    <rect x="-7" y="-420" width="14" height="420" fill="#080F14" rx="3"/>
    <use href="#palm-frond" width="360" height="360" transform="translate(-180 -600)"/>
    <use href="#palm-frond" width="320" height="320" transform="translate(-160 -580) rotate(-40 160 160)"/>
    <use href="#palm-frond" width="320" height="320" transform="translate(-160 -580) rotate(35 160 160)"/>
  </g>
</svg>
