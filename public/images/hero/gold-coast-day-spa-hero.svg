<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Golden-hour Gold Coast horizon with palm silhouettes — Day Spa Gold Coast 2026">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD9A8"/>
      <stop offset="35%" stop-color="#F8B27A"/>
      <stop offset="60%" stop-color="#E07F66"/>
      <stop offset="80%" stop-color="#7BB6B0"/>
      <stop offset="100%" stop-color="#2F6E7A"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.45" r="0.18">
      <stop offset="0%" stop-color="#FFF3D6" stop-opacity="1"/>
      <stop offset="50%" stop-color="#FFC98A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFC98A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3F8C8E"/>
      <stop offset="60%" stop-color="#2A5D6B"/>
      <stop offset="100%" stop-color="#1A3A4C"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9C99A"/>
      <stop offset="100%" stop-color="#C49C6E"/>
    </linearGradient>

    <symbol id="palm-frond" viewBox="-100 -200 200 220">
      <g fill="#0B1E22">
        <path d="M0 0 C -10 -60 -50 -120 -95 -160 C -55 -130 -25 -90 -8 -55 Z"/>
        <path d="M0 0 C 10 -60 50 -120 95 -160 C 55 -130 25 -90 8 -55 Z"/>
        <path d="M0 0 C -30 -50 -90 -90 -140 -100 C -90 -75 -55 -55 -22 -30 Z"/>
        <path d="M0 0 C 30 -50 90 -90 140 -100 C 90 -75 55 -55 22 -30 Z"/>
        <path d="M0 0 C -8 -80 -22 -160 -36 -200 C -22 -150 -10 -90 -3 -50 Z"/>
        <path d="M0 0 C 8 -80 22 -160 36 -200 C 22 -150 10 -90 3 -50 Z"/>
      </g>
    </symbol>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#sun)"/>

  <g opacity="0.45">
    <path d="M0 690 Q 480 660 960 690 T 1920 685 V720 H0 Z" fill="#F2C28A"/>
    <path d="M0 705 Q 480 680 960 705 T 1920 700 V725 H0 Z" fill="#FFFFFF" opacity="0.4"/>
  </g>

  <rect x="0" y="700" width="1920" height="380" fill="url(#ocean)"/>

  <g fill="#FFFFFF" opacity="0.5">
    <path d="M0 760 Q 240 745 480 760 T 960 760 T 1440 760 T 1920 760 V770 H0 Z"/>
    <path d="M0 800 Q 240 788 480 800 T 960 800 T 1440 800 T 1920 800 V808 H0 Z" opacity="0.7"/>
    <path d="M0 850 Q 240 838 480 850 T 960 850 T 1440 850 T 1920 850 V858 H0 Z" opacity="0.55"/>
    <path d="M0 920 Q 240 905 480 920 T 960 920 T 1440 920 T 1920 920 V930 H0 Z" opacity="0.5"/>
  </g>

  <path d="M0 1010 Q 480 980 960 1000 T 1920 1000 V1080 H0 Z" fill="url(#sand)"/>
  <ellipse cx="280" cy="1040" rx="180" ry="6" fill="#000000" opacity="0.18"/>
  <ellipse cx="1640" cy="1040" rx="200" ry="6" fill="#000000" opacity="0.18"/>

  <g transform="translate(180 1020)">
    <rect x="-7" y="-360" width="14" height="360" fill="#0B1E22" rx="3"/>
    <rect x="-9" y="-360" width="18" height="20" fill="#0B1E22" opacity="0.7"/>
    <rect x="-11" y="-300" width="22" height="12" fill="#0B1E22" opacity="0.6"/>
    <rect x="-12" y="-220" width="24" height="14" fill="#0B1E22" opacity="0.55"/>
    <rect x="-12" y="-130" width="24" height="14" fill="#0B1E22" opacity="0.5"/>
    <use href="#palm-frond" x="0" y="-360" width="320" height="320" transform="translate(-160 -160)"/>
    <use href="#palm-frond" x="0" y="-360" width="280" height="280" transform="translate(-140 -140) rotate(35)"/>
    <use href="#palm-frond" x="0" y="-360" width="280" height="280" transform="translate(-140 -140) rotate(-30)"/>
  </g>

  <g transform="translate(1740 1020)">
    <rect x="-7" y="-420" width="14" height="420" fill="#0B1E22" rx="3"/>
    <rect x="-9" y="-420" width="18" height="20" fill="#0B1E22" opacity="0.7"/>
    <rect x="-11" y="-340" width="22" height="12" fill="#0B1E22" opacity="0.6"/>
    <rect x="-12" y="-250" width="24" height="14" fill="#0B1E22" opacity="0.55"/>
    <rect x="-12" y="-150" width="24" height="14" fill="#0B1E22" opacity="0.5"/>
    <use href="#palm-frond" x="0" y="-420" width="360" height="360" transform="translate(-180 -180)"/>
    <use href="#palm-frond" x="0" y="-420" width="320" height="320" transform="translate(-160 -160) rotate(-40)"/>
    <use href="#palm-frond" x="0" y="-420" width="320" height="320" transform="translate(-160 -160) rotate(35)"/>
  </g>

  <g transform="translate(1480 1020)" opacity="0.85">
    <rect x="-5" y="-260" width="10" height="260" fill="#0B1E22" rx="2"/>
    <use href="#palm-frond" x="0" y="-260" width="220" height="220" transform="translate(-110 -110)"/>
    <use href="#palm-frond" x="0" y="-260" width="200" height="200" transform="translate(-100 -100) rotate(-25)"/>
    <use href="#palm-frond" x="0" y="-260" width="200" height="200" transform="translate(-100 -100) rotate(25)"/>
  </g>

  <g transform="translate(420 1020)" opacity="0.85">
    <rect x="-5" y="-240" width="10" height="240" fill="#0B1E22" rx="2"/>
    <use href="#palm-frond" x="0" y="-240" width="200" height="200" transform="translate(-100 -100)"/>
    <use href="#palm-frond" x="0" y="-240" width="180" height="180" transform="translate(-90 -90) rotate(30)"/>
    <use href="#palm-frond" x="0" y="-240" width="180" height="180" transform="translate(-90 -90) rotate(-30)"/>
  </g>
</svg>
